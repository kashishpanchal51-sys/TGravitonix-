<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAVITONIX · Mission Control & Backend API Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background: #030712; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glow-cyan { text-shadow: 0 0 16px rgba(34, 211, 238, 0.7); }
    .glass-card { background: rgba(7, 10, 30, 0.85); border: 1px solid rgba(34, 211, 238, 0.25); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="p-4 sm:p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="glass-card p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 border-cyan-500/40">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-cyan-950/80 border border-cyan-400 flex items-center justify-center text-2xl text-cyan-400 font-bold">⟁</div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-orbitron font-extrabold tracking-wider text-white glow-cyan">
            GRAVITONIX <span class="text-cyan-400">API SUITE</span>
          </h1>
          <p class="text-xs font-mono text-purple-400 tracking-widest mt-1">
            NULL-G LABS · SINGULARITY TENSOR SERVER · v2.4.0
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3 font-mono text-xs">
        <span class="px-3 py-1.5 rounded-lg bg-cyan-950/60 border border-cyan-500/40 text-cyan-300">
          ● SERVER ONLINE
        </span>
        <a href="https://gravitonix-null-g-labs-1.vercel.app/" target="_blank" class="px-4 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-bold hover:brightness-110 transition-all">
          VIEW LIVE WEBSITE ↗
        </a>
      </div>
    </header>

    <!-- Quick Test Console -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Endpoint Nav -->
      <div class="lg:col-span-5 space-y-3">
        <h2 class="font-orbitron text-sm tracking-wider text-cyan-400 uppercase font-bold px-1">
          AVAILABLE QUANTUM ENDPOINTS
        </h2>
        
        <div class="space-y-2 text-xs font-mono">
          <button onclick="testApi('GET', '/api/health')" class="w-full text-left p-3 rounded-xl glass-card hover:border-cyan-400 transition-all flex items-center justify-between">
            <div><span class="text-emerald-400 font-bold">GET</span> /api/health</div>
            <span class="text-gray-400 text-[10px]">System Health</span>
          </button>
          
          <button onclick="testApi('GET', '/api/telemetry/live')" class="w-full text-left p-3 rounded-xl glass-card hover:border-cyan-400 transition-all flex items-center justify-between">
            <div><span class="text-emerald-400 font-bold">GET</span> /api/telemetry/live</div>
            <span class="text-gray-400 text-[10px]">Real-Time HUD</span>
          </button>

          <button onclick="testApi('GET', '/api/chamber')" class="w-full text-left p-3 rounded-xl glass-card hover:border-cyan-400 transition-all flex items-center justify-between">
            <div><span class="text-emerald-400 font-bold">GET</span> /api/chamber</div>
            <span class="text-gray-400 text-[10px]">Chamber State</span>
          </button>

          <button onclick="testApi('POST', '/api/chamber/gravity', { gravity: -1.00 })" class="w-full text-left p-3 rounded-xl glass-card hover:border-purple-400 transition-all flex items-center justify-between">
            <div><span class="text-purple-400 font-bold">POST</span> /api/chamber/gravity (-1.0G)</div>
            <span class="text-gray-400 text-[10px]">Invert Vector</span>
          </button>

          <button onclick="testApi('POST', '/api/chamber/pulse', { x: 400, y: 260, maxRadius: 220 })" class="w-full text-left p-3 rounded-xl glass-card hover:border-purple-400 transition-all flex items-center justify-between">
            <div><span class="text-purple-400 font-bold">POST</span> /api/chamber/pulse</div>
            <span class="text-gray-400 text-[10px]">Shockwave</span>
          </button>

          <button onclick="testApi('GET', '/api/applications')" class="w-full text-left p-3 rounded-xl glass-card hover:border-cyan-400 transition-all flex items-center justify-between">
            <div><span class="text-emerald-400 font-bold">GET</span> /api/applications</div>
            <span class="text-gray-400 text-[10px]">6 Tech Modules</span>
          </button>

          <button onclick="testApi('GET', '/api/bookings/experiences')" class="w-full text-left p-3 rounded-xl glass-card hover:border-cyan-400 transition-all flex items-center justify-between">
            <div><span class="text-emerald-400 font-bold">GET</span> /api/bookings/experiences</div>
            <span class="text-gray-400 text-[10px]">Flight Catalog</span>
          </button>

          <button onclick="testApi('POST', '/api/bookings', { experienceId: 'exp-suborbital-express', passengerName: 'Captain Alex Mercer', email: 'alex.mercer@spacetime.io' })" class="w-full text-left p-3 rounded-xl glass-card hover:border-purple-400 transition-all flex items-center justify-between">
            <div><span class="text-purple-400 font-bold">POST</span> /api/bookings</div>
            <span class="text-gray-400 text-[10px]">Book Pass</span>
          </button>

          <button onclick="testApi('POST', '/api/waitlist', { name: 'Dr. John Doe', email: 'jdoe@caltech.edu', targetInterest: 'Orbital Weightlessness' })" class="w-full text-left p-3 rounded-xl glass-card hover:border-purple-400 transition-all flex items-center justify-between">
            <div><span class="text-purple-400 font-bold">POST</span> /api/waitlist</div>
            <span class="text-gray-400 text-[10px]">Join VIP Queue</span>
          </button>

          <button onclick="testApi('POST', '/api/contact', { name: 'Maya Lin', email: 'maya@quantum.com', message: 'Inquiry regarding Casimir energy licensing' })" class="w-full text-left p-3 rounded-xl glass-card hover:border-purple-400 transition-all flex items-center justify-between">
            <div><span class="text-purple-400 font-bold">POST</span> /api/contact</div>
            <span class="text-gray-400 text-[10px]">Send Message</span>
          </button>
        </div>
      </div>

      <!-- Live Terminal / JSON Output Viewer -->
      <div class="lg:col-span-7 flex flex-col space-y-3">
        <div class="flex items-center justify-between px-1">
          <span class="font-orbitron text-sm tracking-wider text-purple-400 uppercase font-bold">
            LIVE RESPONSE TERMINAL
          </span>
          <span id="response-status" class="font-mono text-xs text-gray-400">AWAITING TRIGGER</span>
        </div>
        
        <div class="glass-card p-5 rounded-2xl flex-1 flex flex-col min-h-[460px] border-cyan-500/30">
          <div class="flex items-center gap-2 pb-3 mb-3 border-b border-gray-800 text-xs font-mono text-gray-400">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500/80"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-green-500/80"></span>
            <span id="terminal-endpoint" class="ml-2 text-cyan-300">GET /api/health</span>
          </div>
          <pre id="terminal-body" class="font-mono text-xs text-cyan-200 overflow-auto flex-1 leading-relaxed bg-black/60 p-4 rounded-xl border border-cyan-500/20">
Click any endpoint on the left to fire a live query into the Gravitonix server...
          </pre>
        </div>
      </div>

    </div>

  </div>

  <script>
    async function testApi(method, endpoint, payload = null) {
      const termEndpoint = document.getElementById('terminal-endpoint');
      const termBody = document.getElementById('terminal-body');
      const termStatus = document.getElementById('response-status');

      termEndpoint.textContent = `${method} ${endpoint}`;
      termStatus.textContent = 'TRANSMITTING...';
      termStatus.className = 'font-mono text-xs text-yellow-400 animate-pulse';

      try {
        const options = {
          method: method,
          headers: {
            'Content-Type': 'application/json'
          }
        };
        if (payload) {
          options.body = JSON.stringify(payload);
        }

        const res = await fetch(endpoint, options);
        const data = await res.json();

        termStatus.textContent = `HTTP ${res.status} · ${res.statusText || 'OK'}`;
        termStatus.className = `font-mono text-xs ${res.ok ? 'text-emerald-400' : 'text-red-400'}`;
        termBody.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        termStatus.textContent = 'CONNECTION FAILED';
        termStatus.className = 'font-mono text-xs text-red-500';
        termBody.textContent = `Error: ${err.message}\nMake sure backend server is active on localhost:5000.`;
      }
    }
  </script>
</body>
</html>
